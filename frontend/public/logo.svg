<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Wall-mounted screen frame -->
  <rect x="10" y="25" width="80" height="50" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Screen bezel -->
  <rect x="12" y="27" width="76" height="46" rx="2" fill="#0f172a"/>
  
  <!-- Active screen display area -->
  <rect x="15" y="30" width="70" height="40" rx="1" fill="#1f2937"/>
  
  <!-- Monitoring grid lines (dashboard panels) -->
  <line x1="50" y1="30" x2="50" y2="70" stroke="#4b5563" stroke-width="1" opacity="0.3"/>
  <line x1="15" y1="50" x2="85" y2="50" stroke="#4b5563" stroke-width="1" opacity="0.3"/>
  
  <!-- Dashboard data indicators (small rectangles to represent metrics) -->
  <rect x="20" y="35" width="8" height="10" fill="#6b7280" opacity="0.6"/>
  <rect x="32" y="38" width="8" height="7" fill="#6b7280" opacity="0.6"/>
  <rect x="55" y="36" width="8" height="9" fill="#6b7280" opacity="0.6"/>
  <rect x="67" y="39" width="8" height="6" fill="#6b7280" opacity="0.6"/>
  
  <!-- Checkmark circle background -->
  <circle cx="72" cy="58" r="14" fill="#10b981" stroke="#059669" stroke-width="2.5"/>
  
  <!-- Checkmark -->
  <path d="M 66 58 L 70 62 L 78 52" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
