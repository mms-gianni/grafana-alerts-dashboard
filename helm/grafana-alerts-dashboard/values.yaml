# Default values for grafana-alerts-dashboard

image:
  repository: ghcr.io/mms-gianni/grafana-alerts-dashboard
  pullPolicy: Always
  tag: 

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 3001
  targetPort: 3001

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: grafana-alerts.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: grafana-alerts-tls
  #    hosts:
  #      - grafana-alerts.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Application configuration
env:
  NODE_ENV: production
  PORT: "3001"
  CORS_ORIGIN: "*"

secrets:
  create: false
  name: ""
  GRAFANA_INSTANCES: '[]'  # JSON string of Grafana instances

# Probes configuration
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 40
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
