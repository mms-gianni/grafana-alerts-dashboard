{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name | default (include "grafana-alerts-dashboard.fullname" .) }}
  {{- with .Values.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- if .Values.secrets.GRAFANA_INSTANCES }}
  GRAFANA_INSTANCES: {{ .Values.secrets.GRAFANA_INSTANCES | b64enc }}
  {{- end }}
{{- end }}
